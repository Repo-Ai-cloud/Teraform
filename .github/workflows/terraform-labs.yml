name: Terraform Labs Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
          terraform_wrapper: false

      - name: Run course quality gates
        shell: pwsh
        run: ./shared/scripts/Test-CourseQuality.ps1

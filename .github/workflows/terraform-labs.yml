name: Terraform Labs Quality

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        terraform_version:
          - "1.12.0"
          - "1.15.8"
    env:
      TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}\terraform-plugin-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create provider cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:TF_PLUGIN_CACHE_DIR | Out-Null

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ matrix.terraform_version }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ matrix.terraform_version }}-

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false

      - name: Run course quality gates
        shell: pwsh
        run: ./shared/scripts/Test-CourseQuality.ps1
